services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: financas
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5433:5432"
    volumes:
      - financas_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d financas"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  financas_postgres:
